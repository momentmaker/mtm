# GoReleaser builds mtm's releases when a v* tag is pushed, and CI builds a
# snapshot of the same on every push (.github/workflows/ci.yml).
version: 2

project_name: mtm

before:
  hooks:
    # Fail rather than rewrite go.mod or go.sum: a release builds exactly
    # what was committed.
    - go mod tidy -diff

builds:
  - id: mtm
    main: ./cmd/mtm
    binary: mtm
    env:
      - CGO_ENABLED=0
    # mtm supports Apple Silicon only (spec 2).
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # The commit's time, not the build's. With the archive's file info below,
    # a rebuild of the same commit with the same Go version gives the same
    # archive.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mtm
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Owner, group, mode and time are pinned, so the archive doesn't depend
    # on the build machine or the checkout's file times.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      # The binary embeds catalog data that this file's BSD-2 notice (tape's)
      # covers, so the notice travels with it.
      - src: catalog/README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

release:
  github:
    owner: momentmaker
    name: mtm
  prerelease: auto
  # GoReleaser publishes the release before the formula and the attestation,
  # so a failed job is re-run. Without this the re-run can't upload the
  # archive again. That's safe: the archive is reproducible.
  replace_existing_artifacts: true
  header: |
    Install with Homebrew:

    ```
    brew install momentmaker/tap/mtm
    ```

    Check where an archive came from:

    ```
    gh attestation verify mtm_{{ .Version }}_darwin_arm64.tar.gz --repo momentmaker/mtm
    ```

# A formula, not a cask: a binary Homebrew downloads for a formula carries no
# quarantine flag, so the un-notarized mtm runs without removing Gatekeeper's
# check (spec 6.6). GoReleaser marks brews deprecated in favor of casks.
brews:
  - name: mtm
    repository:
      owner: momentmaker
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/momentmaker/mtm
    description: "Move a developer's Mac to a new Mac and prove nothing was lost"
    # A prerelease tag such as v0.1.0-rc.1 doesn't update the tap's formula.
    skip_upload: auto
    license: MIT
    custom_block: |
      depends_on arch: :arm64
      depends_on macos: :tahoe
    install: |
      bin.install "mtm"
    test: |
      assert_match version.to_s, shell_output("#{bin}/mtm version")
