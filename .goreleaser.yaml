# GoReleaser builds mtm's releases when a v* tag is pushed, and CI builds a
# snapshot of the same on every push (.github/workflows/ci.yml).
version: 2

project_name: mtm

before:
  hooks:
    # Fail rather than rewrite go.mod or go.sum: a release builds exactly
    # what was committed.
    - go mod tidy -diff

builds:
  - id: mtm
    main: ./cmd/mtm
    binary: mtm
    env:
      - CGO_ENABLED=0
    # mtm supports Apple Silicon only (spec 2).
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # The commit's time, not the build's. With the archive's file info below,
    # a rebuild of the same commit with the same Go version gives the same
    # archive.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mtm
    formats: [tar.gz]
    # No version in the name, so releases/latest/download/mtm_darwin_arm64.tar.gz
    # always points at the newest release.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # Owner, group, mode and time are pinned, so the archive doesn't depend
    # on the build machine or the checkout's file times.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      # The binary embeds catalog data that this file's BSD-2 notice (tape's)
      # covers, so the notice travels with it.
      - src: catalog/README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

release:
  github:
    owner: momentmaker
    name: mtm
  prerelease: auto
  # The attestation runs after GoReleaser publishes, so a failed job is
  # re-run. Without this the re-run can't upload the archive again. That's
  # safe: the archive is reproducible.
  replace_existing_artifacts: true
  header: |
    Install with Go 1.26:

    ```
    go install github.com/momentmaker/mtm/cmd/mtm@{{ .Tag }}
    ```

    Or download the archive with curl. mtm isn't notarized, and macOS won't
    run a binary a browser downloaded; curl doesn't mark it that way.

    ```
    mkdir -p ~/.local/bin
    curl -fsSL https://github.com/momentmaker/mtm/releases/download/{{ .Tag }}/mtm_darwin_arm64.tar.gz | tar -xz -C ~/.local/bin mtm
    ```

    Check where an archive came from:

    ```
    gh attestation verify mtm_darwin_arm64.tar.gz --repo momentmaker/mtm
    ```
